<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gem Mine</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d09; overflow: hidden; overscroll-behavior: none; }
  body {
    height: 100vh; height: 100dvh; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   GEM MINE  -  dig & drop prototype

   Free every gem and let it fall into the cart, using as few digs as you can.
   - Tap dirt or sand to dig it out. Tap TNT to blow a 3x3 hole (stone and gems survive).
   - Gems and sand fall. They also roll off the edge of stone, gems and sand piles.
   - The rules below (between LOGIC START and LOGIC END) are the same code the level checker used,
     so every level was proven solvable, with no dead ends, before it shipped.
   ===================================================================== */

// ==LOGIC START==
// Grid is a string of W*H chars, row-major, row 0 on top.
// '.' empty  'd' dirt  's' stone  'a' sand  't' TNT   'R' 'B' 'G' 'Y' 'P' gems
const isGem = ch => ch >= 'A' && ch <= 'Z';
// One physics step, bottom-up so nothing moves twice. Returns {g, changed, out:[colors that left the mine], moves:[[r0,c0,r1,c1,ch]...]}
function tick(g, W, H) {
  const a = g.split(''); const out = [], moves = []; let changed = false;
  for (let r = H - 1; r >= 0; r--) for (let c = 0; c < W; c++) {
    const ch = a[r * W + c];
    if (!isGem(ch) && ch !== 'a') continue;
    if (r === H - 1) { a[r * W + c] = '.'; changed = true; if (isGem(ch)) out.push(ch); moves.push([r, c, H, c, ch]); continue; }
    const below = a[(r + 1) * W + c];
    if (below === '.') { a[r * W + c] = '.'; a[(r + 1) * W + c] = ch; changed = true; moves.push([r, c, r + 1, c, ch]); continue; }
    if (below === 's' || isGem(below) || below === 'a') {                 // round things roll off the edge of a pile
      for (const d of [-1, 1]) {
        const nc = c + d;
        if (nc < 0 || nc >= W) continue;
        if (a[r * W + nc] === '.' && a[(r + 1) * W + nc] === '.') { a[r * W + c] = '.'; a[(r + 1) * W + nc] = ch; changed = true; moves.push([r, c, r + 1, nc, ch]); break; }
      }
    }
  }
  return { g: a.join(''), changed, out, moves };
}
function settle(g, W, H) {
  let out = 0, n = 0;
  for (let k = 0; k < 400; k++) { const t = tick(g, W, H); if (!t.changed) break; g = t.g; out += t.out.length; n++; }
  return { g, out, ticks: n };
}
// A tap digs dirt/sand, or sets off TNT (3x3, chains through neighbouring TNT; stone and gems survive).
function tap(g, W, H, r, c) {
  const a = g.split(''), ch = a[r * W + c];
  if (ch === 'd' || ch === 'a') { a[r * W + c] = '.'; return { g: a.join(''), blast: null }; }
  if (ch !== 't') return null;
  const q = [[r, c]], seen = new Set([r * W + c]), cleared = [];
  while (q.length) {
    const [qr, qc] = q.shift(); a[qr * W + qc] = '.'; cleared.push([qr, qc]);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = qr + dr, nc = qc + dc; if (nr < 0 || nr >= H || nc < 0 || nc >= W) continue;
      const k = nr * W + nc, x = a[k];
      if ((dr || dc) && !seen.has(k)) { if (x === 't') { seen.add(k); q.push([nr, nc]); } else if (x === 'd' || x === 'a') { a[k] = '.'; cleared.push([nr, nc]); } }
    }
  }
  return { g: a.join(''), blast: cleared };
}
const tappable = (g, forbid) => { const o = []; for (let i = 0; i < g.length; i++) { const ch = g[i]; if (ch === 'd' || ch === 'a' || ch === 't') o.push(i); } return o; };
const gemsLeft = g => { let n = 0; for (const ch of g) if (isGem(ch)) n++; return n; };
// ==LOGIC END==

const LEVELS = [
  {"name":"First dig","fresh":"Dig!","rows":["s.R.s","s.d.s","s...s","s...s","s...s"],"par":1,"extra":2},
  {"name":"Roll with it","fresh":"Gems roll off ledges","hint":"Open the side with a free drop.","rows":["..R..",".dsd.",".....",".d...","....."],"par":1,"extra":2},
  {"name":"Two for one","fresh":"One dig can free two gems","hint":"Both gems want the same gap.","rows":[".R.B.","ssdss",".d.d.","..d..",".....","....."],"par":2,"extra":2},
  {"name":"Look ahead","hint":"Count every dig on the way down.","rows":[".....","..Rd.",".dsd.",".d...",".d...",".....","....."],"par":2,"extra":1},
  {"name":"Sand falls","fresh":"Sand falls and flows","hint":"Cut what holds the sand up.","rows":[".R.B.","sasds","sasds","sasds","sds.s",".....","....."],"par":4,"extra":2},
  {"name":"Sand shortcut","hint":"Sand can be a shortcut.","rows":[".......",".Ra.aR.","dsdsdsd","d..s..d","d..s..d",".......","......."],"par":2,"extra":1},
  {"name":"Boom","fresh":"TNT blasts a 3x3 hole","hint":"Stone and gems survive the blast.","rows":[".....","..R..",".ddd.",".dtd.",".ddd.",".ddd.","....."],"par":2,"extra":2},
  {"name":"Blast radius","hint":"One blast, two exits.","rows":[".R.B.","ssdss",".dtd.","..d..",".....","....."],"par":1,"extra":1},
  {"name":"Sand and TNT","hint":"Every exit needs a plan.","rows":[".......",".Ra..R.","dsdsdsd","d..st.d","d..s..d",".......","......."],"par":2,"extra":1},
  {"name":"Grand dig","hint":"Open the floor last.","rows":[".......",".RaYaB.","dsdsdsd","d..s..d","d..s..d",".......","dsdtdsd",".......","......."],"par":3,"extra":1}
];

const DEV = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const COLORS = {
  R: { c: '#f2405f', l: '#ffa3b5', d: '#85112e', glow: '255,70,100',  shape: 'dia' },
  B: { c: '#3f86f5', l: '#a9d0ff', d: '#16399a', glow: '70,140,255',  shape: 'hex' },
  G: { c: '#1fc96f', l: '#9af5c4', d: '#0a683a', glow: '40,220,120',  shape: 'sq'  },
  Y: { c: '#ffb71f', l: '#fff0a0', d: '#a35f00', glow: '255,190,50',  shape: 'tri' },
  P: { c: '#a65cf0', l: '#e6bcff', d: '#4a1c8a', glow: '175,100,255', shape: 'pent' },
};
const COLOR_KEYS = ['R', 'B', 'G', 'Y', 'P'];
const TICK = 0.085;                 // seconds per gravity step
const LW = 390, LH = 844, HUD_H = 92;

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, offX = 0, offY = 0, scale = 1, Q = 1, VX0 = 0, VY0 = 0, VW = LW, VH = LH;
let S = null, last = 0, bgCanvas = null, cave = null;
const lay = { cs: 56, bx: 0, by: 0, bw: 0, bh: 0, cartY: 0 };
const hash = n => { const h = Math.sin(n * 12.9898) * 43758.5453; return h - Math.floor(h); };
const lerp = (a, b, t) => a + (b - a) * t;
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

// ---------- progress ----------
const SAVE_KEY = 'gemmine.v2';
function loadSave() { try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); if (o && o.stars) return o; } catch (e) {} return { unlocked: 1, stars: {} }; }
const SAVE = loadSave();
function saveSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
const DEBUG_UNLOCK = DEV && new URLSearchParams(location.search).has('level');
const isUnlocked = i => DEBUG_UNLOCK || i < SAVE.unlocked;

// ---------- level ----------
function loadLevel(i) {
  const L = LEVELS[i], rows = L.rows, h = rows.length, w = rows[0].length;
  const grid = rows.join('');
  const total = [...grid].filter(isGem).length;
  S = {
    level: i, w, h, grid, total, collected: 0, moves: 0, par: L.par, limit: L.par + (L.extra === undefined ? 2 : L.extra),
    status: i === 0 && !SAVE.stars[0] ? 'play' : 'intro', t: 0, anim: null, settling: false, queued: null, hist: [], lastDest: new Set(),
    squash: new Map(), wobble: new Map(), particles: [], floats: [], confetti: [], shake: 0, flash: [], toast: null, buttons: [], taps: [],
    cart: { x: 0, tx: 0, bounce: 0, heap: [] }, stars: 0, endT: 0, gemId: {},
  };
  S.cart.x = S.cart.tx = LW / 2;
  resize();
  if (S.status === 'play' && L.hint) S.toast = { s: L.hint, t: 5 };
}
const tappableCh = ch => ch === 'd' || ch === 'a' || ch === 't';

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const rect = cv.getBoundingClientRect(); W = Math.max(1, rect.width); H = Math.max(1, rect.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  scale = Math.min(W / LW, H / LH); offX = (W - LW * scale) / 2; offY = (H - LH * scale) / 2; Q = dpr * scale;
  VX0 = -offX / scale; VY0 = -offY / scale; VW = W / scale; VH = H / scale;
  sprites.clear(); makeBackground();
  if (!S || !S.w) return;
  const cs = Math.floor(Math.min(62, (LW - 44) / S.w, 560 / S.h));
  lay.cs = cs; lay.bw = cs * S.w; lay.bh = cs * S.h; lay.bx = (LW - lay.bw) / 2;
  lay.by = HUD_H + 22 + Math.max(0, (560 - lay.bh) / 2);
  lay.cartY = lay.by + lay.bh + 6;
  makeCave();
}
const cellX = c => lay.bx + (c + 0.5) * lay.cs, cellY = r => lay.by + (r + 0.5) * lay.cs;

// ---------- drawing helpers ----------
function font(size, weight = 700) { ctx.font = `${weight} ${size}px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif`; }
function txt(s, x, y, size, color, align = 'center', weight = 700, shadow = false) {
  font(size, weight); ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`; }
function glossBtn(x, y, w, h, r, base) {
  ctx.save(); ctx.shadowColor = 'rgba(25,10,0,0.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  rr(x, y + 2, w, h - 2, r); ctx.fillStyle = mixHex(base, '#000000', 0.45); ctx.fill(); ctx.restore();
  const g = ctx.createLinearGradient(0, y, 0, y + h - 3); g.addColorStop(0, mixHex(base, '#ffffff', 0.4)); g.addColorStop(1, base);
  rr(x, y, w, h - 3, r); ctx.fillStyle = g; ctx.fill();
  rr(x + 3, y + 2, w - 6, (h - 3) * 0.42, r - 2); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
  rr(x, y, w, h - 3, r); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.stroke();
}
function nail(x, y) { ctx.fillStyle = '#9aa0a6'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(x + 0.6, y + 0.6, 1.1, 0, 7); ctx.fill(); }
function panel(x, y, w, h) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; rr(x, y, w, h, 20); ctx.fillStyle = '#5a3a20'; ctx.fill(); ctx.restore();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#7a5230'); g.addColorStop(1, '#4a2f1a');
  rr(x + 5, y + 5, w - 10, h - 10, 16); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
  for (let k = 1; k < 9; k++) { ctx.beginPath(); ctx.moveTo(x + 8, y + (h / 9) * k); ctx.lineTo(x + w - 8, y + (h / 9) * k); ctx.stroke(); }
  rr(x, y, w, h, 20); ctx.lineWidth = 4; ctx.strokeStyle = '#c99a5a'; ctx.stroke();
  [[x + 14, y + 14], [x + w - 14, y + 14], [x + 14, y + h - 14], [x + w - 14, y + h - 14]].forEach(([nx, ny]) => nail(nx, ny));
}
function plank(x, y, w, h, seedN) {
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#6a4526'); g.addColorStop(1, '#3d2714'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1;
  for (let k = 0; k < 7; k++) { const gy = y + 3 + hash(seedN + k) * (h - 6), gx = x + hash(seedN + k + 30) * w * 0.8; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + 20 + hash(seedN + k + 60) * 50, gy + (hash(seedN + k + 90) - 0.5) * 2); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,220,170,0.18)'; ctx.fillRect(x, y, w, 1.5); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, y + h - 2, w, 2);
}

// ---------- sprites ----------
const sprites = new Map();
function sprite(key, size, draw) {
  const k = key + ':' + Math.round(size) + ':' + Q.toFixed(2); let s = sprites.get(k); if (s) return s;
  const sc = Math.max(2, Q * 1.5), c2 = document.createElement('canvas'); const pad = 6; const full = Math.ceil((size + pad * 2) * sc); c2.width = c2.height = full;
  const g = c2.getContext('2d'); g.scale(sc, sc); g.translate(pad, pad); draw(g, size); s = { cv: c2, pad, size }; sprites.set(k, s); return s;
}
function blit(s, cx, cy, sx = 1, sy = 1, rot = 0) {
  const total = s.size + s.pad * 2; ctx.save(); ctx.translate(cx, cy); if (rot) ctx.rotate(rot); ctx.scale(sx, sy); ctx.drawImage(s.cv, -total / 2, -total / 2, total, total); ctx.restore();
}
function rrg(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function dirtSprite(cs, v) { return sprite('dirt' + v, cs, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, '#a9763f'); gr.addColorStop(1, '#7c5028');
  rrg(g, 1, 1, s - 2, s - 2, s * 0.16); g.fillStyle = gr; g.fill();
  g.save(); rrg(g, 1, 1, s - 2, s - 2, s * 0.16); g.clip();
  for (let k = 0; k < 14; k++) { const x = hash(v * 31 + k) * s, y = hash(v * 17 + k + 40) * s, r = 1.2 + hash(k + v) * 3; g.fillStyle = k % 3 ? 'rgba(60,30,10,0.35)' : 'rgba(255,225,170,0.3)'; g.beginPath(); g.ellipse(x, y, r, r * 0.8, 0, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,230,180,0.32)'; g.fillRect(0, 0, s, s * 0.1); g.fillStyle = 'rgba(40,20,5,0.3)'; g.fillRect(0, s * 0.9, s, s * 0.1); g.restore();
  rrg(g, 1, 1, s - 2, s - 2, s * 0.16); g.lineWidth = 1.5; g.strokeStyle = 'rgba(50,25,8,0.7)'; g.stroke(); }); }
function stoneSprite(cs, v) { return sprite('stone' + v, cs, (g, s) => {
  const gr = g.createLinearGradient(0, 0, s, s); gr.addColorStop(0, '#9aa1a8'); gr.addColorStop(1, '#5d646b');
  rrg(g, 1, 1, s - 2, s - 2, s * 0.22); g.fillStyle = gr; g.fill();
  g.save(); rrg(g, 1, 1, s - 2, s - 2, s * 0.22); g.clip();
  g.strokeStyle = 'rgba(30,34,38,0.55)'; g.lineWidth = 1.6; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(s * 0.2, s * 0.15); g.lineTo(s * 0.42, s * 0.4); g.lineTo(s * 0.34, s * 0.62); g.lineTo(s * 0.55, s * 0.85); g.stroke();
  g.beginPath(); g.moveTo(s * 0.42, s * 0.4); g.lineTo(s * 0.75, s * 0.3); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.22)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(s, 0); g.lineTo(s * 0.6, s * 0.18); g.lineTo(0, s * 0.3); g.fill(); g.restore();
  rrg(g, 1, 1, s - 2, s - 2, s * 0.22); g.lineWidth = 2; g.strokeStyle = '#31373d'; g.stroke(); }); }
function sandSprite(cs, v) { return sprite('sand' + v, cs, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, '#f6dc8d'); gr.addColorStop(1, '#d9ae4f');
  rrg(g, 1, 1, s - 2, s - 2, s * 0.28); g.fillStyle = gr; g.fill();
  g.save(); rrg(g, 1, 1, s - 2, s - 2, s * 0.28); g.clip();
  g.strokeStyle = 'rgba(150,100,20,0.35)'; g.lineWidth = 1.4;
  for (let k = 0; k < 3; k++) { g.beginPath(); for (let x = 0; x <= s; x += 4) { const y = s * (0.28 + k * 0.24) + Math.sin(x * 0.28 + k + v) * 2.2; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  for (let k = 0; k < 16; k++) { g.fillStyle = k % 2 ? 'rgba(255,250,210,0.7)' : 'rgba(150,100,20,0.4)'; g.fillRect(hash(k + v * 9) * s, hash(k * 3 + v) * s, 1.8, 1.8); }
  g.restore(); rrg(g, 1, 1, s - 2, s - 2, s * 0.28); g.lineWidth = 1.5; g.strokeStyle = 'rgba(120,80,15,0.8)'; g.stroke(); }); }
function tntSprite(cs) { return sprite('tnt', cs, (g, s) => {
  const gr = g.createLinearGradient(0, 0, s, 0); gr.addColorStop(0, '#e2483a'); gr.addColorStop(0.5, '#ff7a5c'); gr.addColorStop(1, '#b32b22');
  rrg(g, 2, s * 0.16, s - 4, s * 0.76, s * 0.14); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(70,10,8,0.35)'; for (const x of [s * 0.33, s * 0.66]) g.fillRect(x - 1, s * 0.16, 2, s * 0.76);
  g.fillStyle = '#f3e8c8'; rrg(g, s * 0.12, s * 0.5, s * 0.76, s * 0.2, 3); g.fill();
  g.font = `900 ${s * 0.17}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#7a1710'; g.fillText('TNT', s / 2, s * 0.6);
  rrg(g, 2, s * 0.16, s - 4, s * 0.76, s * 0.14); g.lineWidth = 2; g.strokeStyle = '#6e1610'; g.stroke(); }); }
function gemPoints(shape, r) {
  if (shape === 'dia') return [[0, -r], [r * 0.78, 0], [0, r], [-r * 0.78, 0]];
  if (shape === 'hex') return [0, 1, 2, 3, 4, 5].map(k => { const a = Math.PI / 6 + k * Math.PI / 3; return [Math.cos(a) * r, Math.sin(a) * r]; });
  if (shape === 'pent') return [0, 1, 2, 3, 4].map(k => { const a = -Math.PI / 2 + k * Math.PI * 2 / 5; return [Math.cos(a) * r, Math.sin(a) * r]; });
  if (shape === 'sq') { const a = r * 0.95, b = r * 0.5; return [[-b, -a], [b, -a], [a, -b], [a, b], [b, a], [-b, a], [-a, b], [-a, -b]]; }
  return [[0, -r], [r * 0.98, r * 0.82], [-r * 0.98, r * 0.82]];
}
function gemSprite(col, r) { return sprite('gem' + col, r * 2.4, (g, s) => {
  g.translate(s / 2 - 6 + 6, s / 2 - 6 + 6); g.translate(-6, -6); g.translate(0, 0);
  const C = COLORS[col], rad = r;
  const glow = g.createRadialGradient(0, 0, rad * 0.4, 0, 0, rad * 1.25); glow.addColorStop(0, `rgba(${C.glow},0.5)`); glow.addColorStop(1, `rgba(${C.glow},0)`);
  g.fillStyle = glow; g.beginPath(); g.arc(0, 0, rad * 1.25, 0, 7); g.fill();
  const P = gemPoints(C.shape, rad), lx = -0.62, ly = -0.78;
  for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, ml = Math.hypot(mx, my) || 1, lit = (mx / ml * lx + my / ml * ly + 1) / 2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.closePath(); g.fillStyle = lit > 0.5 ? mixHex(C.c, C.l, (lit - 0.5) * 2) : mixHex(C.d, C.c, lit * 2); g.fill(); }
  g.beginPath(); P.forEach((q, i) => i ? g.lineTo(q[0] * 0.55, q[1] * 0.55) : g.moveTo(q[0] * 0.55, q[1] * 0.55)); g.closePath();
